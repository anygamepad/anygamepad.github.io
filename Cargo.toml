[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anygamepad/anygamepad.github.io"
homepage = "https://anygamepad.github.io"
authors = ["The anygamepad contributors"]

[workspace.dependencies]
anygamepad = { path = "crates/anygamepad", version = "0.0.0" }
anygamepad-db = { path = "crates/anygamepad-db", version = "0.0.0" }
anygamepad-model = { path = "crates/anygamepad-model", version = "0.0.0" }
anygamepad-report = { path = "crates/anygamepad-report", version = "0.0.0" }
js-sys = "0.3.77"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
schemars = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-test = "0.3.50"
web-sys = "0.3.77"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# AGENTS.md: every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"

# Whole-program optimization: the web app's WebAssembly module is about 5%
# smaller (gzip) after wasm-opt; opt-level "s" or "z" do not beat it.
[profile.release]
lto = true
codegen-units = 1

# The TypeScript declarations of the model (feature `tsify`) are custom
# sections in its object files, and the linker drops the object files that the
# web bindings do not reference. A single codegen unit keeps them all.
[profile.dev.package.anygamepad-model]
codegen-units = 1

[profile.release.package.anygamepad-model]
codegen-units = 1
