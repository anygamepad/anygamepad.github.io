<!doctype html>
<!--
  The test mode (roadmap tasks H4 and W9), published at
  https://anygamepad.github.io/test/ and linked from the tester's footer. It
  is the tester's page (src/App.html) with `data-page="test"`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Test a gamepad step by step in the browser and get an anonymous test report of what works."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>anygamepad: test mode</title>
  </head>
  <body data-page="test">
    <div id="app"></div>
    <noscript>The test mode needs JavaScript and WebAssembly.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
