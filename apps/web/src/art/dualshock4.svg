709.1 230.3 704.3 C232.5 699.4 235.6 694.8 237.5 689.9 C239.5 684.9 240.2 679.5 241.9 674.4 C243.5 669.3 245.4 664.2 247.4 659.2 C249.4 654.2 252.1 649.5 253.9 644.4 C255.7 639.4 256.4 634.0 258.1 628.9 C259.9 623.8 261.1 618.0 264.3 614.0 C267.4 610.1 274.9 606.6 277.0 605.1 C279.2 606.0 285.8 608.5 290.0 610.7 C294.2 612.8 298.0 616.0 302.3 618.0 C306.6 620.1 311.3 621.4 315.8 622.9 C320.3 624.5 324.8 626.2 329.5 627.2 C334.2 628.2 339.0 628.5 343.8 628.7 C348.6 628.8 353.3 628.5 358.1 628.1 C362.9 627.7 367.7 627.2 372.3 626.1 C377.0 625.1 381.5 623.4 385.9 621.7 C390.4 620.0 394.9 618.2 399.1 615.9 C403.3 613.7 407.2 610.9 411.2 608.3 C415.3 605.7 421.1 601.7 423.1 600.4 H511.5 H600 C601.9 601.7 607.7 605.7 611.8 608.3 C615.8 610.9 619.7 613.7 623.9 615.9 C628.1 618.2 632.6 620.0 637.1 621.7 C641.5 623.4 646.0 625.1 650.7 626.1 C655.3 627.2 660.1 627.7 664.9 628.1 C669.7 628.5 674.4 628.8 679.2 628.7 C684.0 628.5 688.8 628.2 693.5 627.2 C698.2 626.2 702.7 624.5 707.2 622.9 C711.7 621.4 716.4 620.1 720.7 618.0 C725.0 616.0 728.8 612.8 733.0 610.7 C737.2 608.5 743.8 606.0 746.0 605.1 C748.1 606.6 755.6 610.1 758.7 614.0 C761.9 618.0 763.1 623.8 764.9 628.9 C766.6 634.0 767.3 639.4 769.1 644.4 C770.9 649.5 773.6 654.2 775.6 659.2 C777.6 664.2 779.5 669.3 781.1 674.4 C782.8 679.5 783.5 684.9 785.5 689.9 C787.4 694.8 790.5 699.4 792.7 704.3 C795.0 709.1 797.1 714.1 798.9 719.2 C800.8 724.2 801.6 729.6 803.7 734.5 C805.8 739.4 808.8 744.0 811.4 748.6 C814.1 753.3 817.0 757.8 819.8 762.5 C822.6 767.1 825.5 771.7 828.1 776.3 C830.8 781.0 832.8 786.3 835.8 790.3 C838.9 794.3 842.7 796.9 846.5 800.2 C850.4 803.6 855.0 806.9 858.9 810.5 C862.8 814.0 865.5 818.7 869.9 821.2 C874.3 823.8 880.2 824.3 885.4 825.9 C890.5 827.4 895.6 829.5 900.8 830.5 C906.1 831.5 911.5 831.9 916.9 832.0 C922.3 832.1 927.7 831.7 933.0 831.0 C938.3 830.3 943.7 829.3 948.8 827.7 C953.9 826.1 958.9 823.9 963.7 821.4 C968.4 818.9 973.0 816.0 977.2 812.7 C981.4 809.3 985.3 805.4 988.8 801.4 C992.3 79