    <clipPath id="ds4-clip"><use href="#ds4-outline"/></clipPath>
  </defs>

  <!-- Body: the outline, also the grip pads' clip path -->
  <use href="#ds4-outline" fill="url(#ds4-body)" stroke="#c6c6cc" stroke-width="2" filter="url(#ds4-shadow)"/>

  <!-- Triggers L2 / R2: travel bars, drawn by the tester -->
  <g data-trigger="left_trigger" data-x="145" data-y="160" data-width="110" data-height="26"/>
  <g data-trigger="right_trigger" data-x="768" data-y="160" data-width="110" data-height="26"/>

  <!-- Bumpers L1 / R1 -->
  <g data-button="left_shoulder">
    <path class="shape" d="M138 217 C139 203 150 198 176 198 H225 C251 198 261 203 262 217 Z" fill="url(#ds4-bump)" stroke="#b4b8c8" stroke-width="2.5"/>
  </g>
  <g data-button="right_shoulder">
    <path class="shape" d="M885 217 C884 203 873 198 847 198 H798 C772 198 762 203 761 217 Z" fill="url(#ds4-bump)" stroke="#b4b8c8" stroke-width="2.5"/>
  </g>

  <!-- Grip pads -->
  <g clip-path="url(#ds4-clip)">
    <path d="M-10 695 C40 742 120 774 222 735 L270 900 L-10 900 Z" fill="url(#ds4-pad)"/>
    <path d="M-10 695 C40 742 120 774 222 735" fill="none" stroke="#cfcfd5" stroke-width="2"/>
    <g transform="translate(1023 0) scale(-1 1)">
      <path d="M-10 695 C40 742 120 774 222 735 L270 900 L-10 900 Z" fill="url(#ds4-pad)"/>
      <path d="M-10 695 C40 742 120 774 222 735" fill="none" stroke="#cfcfd5" stroke-width="2"/>
    </g>
  </g>

  <!-- Touchpad -->
  <g data-button="touchpad_click" data-touchpad="343 230 337 185">
    <path class="shape" d="M339 226 H684 V404 Q684 419 669 419 H354 Q339 419 339 404 Z"
          fill="url(#ds4-touch)" stroke="#b9b9bf" stroke-width="2.5"/>
    <path d="M343 230 H680 V402 Q680 415 667 415 H356 Q343 415 343 402 Z" fill="url(#ds4-dots)"/>
  </g>

  <!-- Share / Options -->
  <g data-button="select">
    <rect class="shape" x="285" y="250" width="35" height="60" rx="16" fill="#f4f4fa" stroke="#a9adbd" stroke-width="2.5"/>
  </g>
  <g data-button="start">
    <rect class="shape" x="704" y="250" width="35" height="61" rx="16" fill="#f4f4fa" stroke="#a9adbd" stroke-width="2.5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#b8b8bd" text-anchor="middle">
    <text x="304" y="244">SHARE</text>
    <text x="726" y="244">OPTIONS</text>
  </g>

  <!-- Recesses of the D-pad and the face buttons -->
  <g fill="#f5f5f7" stroke="#e1e1e6" stroke-width="2">
    <circle cx="191.500" cy="381.500" r="116"/>
    <circle cx="831.500" cy="381.500" r="116"/>
  </g>
  <g fill="#d6d6db">
    <path d="M181 288 L193 272 L205 288 Z"/>
    <path d="M181 475 L193 491 L205 475 Z" transform="translate(-3 0)"/>
    <path d="M98 370 L82 382 L98 394 Z"/>
    <path d="M285 370 L301 382 L285 394 Z"/>
  </g>

  <!-- D-pad: one arm, rotated around (191.5 381.5) -->
  <g data-button="dpad_up">
    <path class="shape" d="M166.800 353.800 L163.500 315 Q162.500 293.500 183 293.500 H200 Q220.500 293.500 219.500 315 L216.200 353.800 L191.500 376.500 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g data-button="dpad_right" transform="rotate(90 191.500 381.500)">
    <path class="shape" d="M166.800 353.800 L163.500 315 Q162.500 293.500 183 293.500 H200 Q220.500 293.500 219.500 315 L216.200 353.800 L191.500 376.500 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g data-button="dpad_down" transform="rotate(180 191.500 381.500)">
    <path class="shape" d="M166.800 353.800 L163.500 315 Q162.500 293.500 183 293.500 H200 Q220.500 293.500 219.500 315 L216.200 353.800 L191.500 376.500 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g data-button="dpad_left" transform="rotate(270 191.500 381.500)">
    <path class="shape" d="M166.800 353.800 L163.500 315 Q162.500 293.500 183 293.500 H200 Q220.500 293.500 219.500 315 L216.200 353.800 L191.500 376.500 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Face buttons: triangle, square, circle, cross -->
  <g data-button="north">
    <circle class="shape" cx="832" cy="307" r="35.500" fill="url(#ds4-btn)" stroke="#aeb2c2" stroke-width="3.2"/>
    <path class="mark" d="M832 290 L848 317 H816 Z"
          fill="none" stroke="#5ec7bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-button="west">
    <circle class="shape" cx="756" cy="383" r="35.500" fill="url(#ds4-btn)" stroke="#aeb2c2" stroke-width="3.2"/>
    <rect class="mark" x="741" y="368" width="30" height="30" rx="2"
          fill="none" stroke="#e3a9d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-button="east">
    <circle class="shape" cx="907" cy="383" r="35.500" fill="url(#ds4-btn)" stroke="#aeb2c2" stroke-width="3.2"/>
    <circle class="mark" cx="907" cy="383" r="16"
            fill="none" stroke="#e8697f" stroke-width="4"/>
  </g>
  <g data-button="south">
    <circle class="shape" cx="832" cy="459" r="35.500" fill="url(#ds4-btn)" stroke="#aeb2c2" stroke-width="3.2"/>
    <path class="mark" d="M818 445 L846 473 M846 445 L818 473"
          fill="none" stroke="#7b9bf0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sticks: the ring stays, the cap moves -->
  <g data-stick="left" data-travel="24" data-value-y="128" transform="translate(346 528)">
    <circle r="99" fill="url(#ds4-ring)" stroke="#dcdce1" stroke-width="2"/>
    <g data-cap="" data-button="left_stick">
      <circle class="shape" r="64" fill="url(#ds4-cap)" stroke="#5a5f71" stroke-width="2.5"/>
      <circle class="shape" r="46" fill="none" stroke="#8a90a3" stroke-width="3"/>
    </g>
  </g>
  <g data-stick="right" data-travel="24" data-value-y="128" transform="translate(677 528)">
    <circle r="99" fill="url(#ds4-ring)" stroke="#dcdce1" stroke-width="2"/>
    <g data-cap="" data-button="right_stick">
      <circle class="shape" r="64" fill="url(#ds4-cap)" stroke="#5a5f71" stroke-width="2.5"/>
      <circle class="shape" r="46" fill="none" stroke="#8a90a3" stroke-width="3"/>
    </g>
  </g>

  <!-- Speaker -->
  <g fill="#232326">
    <circle cx="474" cy="444" r="4.2"/>
    <circle cx="493" cy="444" r="4.2"/>
    <circle cx="511" cy="444" r="4.2"/>
    <circle cx="530" cy="444" r="4.2"/>
    <circle cx="548" cy="444" r="4.2"/>
    <circle cx="484" cy="457" r="4.2"/>
    <circle cx="502" cy="457" r="4.2"/>
    <circle cx="520" cy="457" r="4.2"/>
    <circle cx="539" cy="457" r="4.2"/>
    <circle cx="493" cy="471" r="4.2"/>
    <circle cx="511" cy="471" r="4.2"/>
    <circle cx="530" cy="471" r="4.2"/>
  </g>

  <!-- PS button -->
  <g data-button="home">
    <circle class="shape" cx="511.500" cy="527.500" r="28" fill="url(#ds4-btn)" stroke="#aeb2c2" stroke-width="3.2"/>
    <circle class="mark" cx="511.500" cy="527.500" r="11" fill="none" stroke="#c3c7d6" stroke-width="3"/>
  </g>

  <!-- EXT port -->
  <rect x="460" y="591" width="102" height="11" rx="5.500" fill="#141416"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#8f8f95" text-anchor="middle">
    <text x="494" y="586">EXT</text>
  </g>
  <path d="M537 585 a7 7 0 0 1 14 0" fill="none" stroke="#8f8f95" stroke-width="1.6" stroke-linecap="round"/>
</svg>
