<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 150 1044 700" role="img">
  <!--
    DualShock 4, front view: the project owner's design (2026-10-14). The
    sticks and touchpad take the DualSense's stick colours, as in every
    drawing, and the D-pad and buttons the DualSense's light ones.

    Marked up for the tester like art/dualsense.svg (see there), with the
    same arrangement: the shapes on the top edge are the L1/R1 bumpers, and
    the L2/R2 travel bars go above them.
  -->
  <defs>
    <linearGradient id="ds4-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f3f5"/>
      <stop offset="1" stop-color="#e2e2e7"/>
    </linearGradient>
    <linearGradient id="ds4-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececf0"/>
      <stop offset="1" stop-color="#dcdce2"/>
    </linearGradient>
    <!-- Buttons and bumpers: the DualSense's -->
    <radialGradient id="ds4-btn" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="1" stop-color="#e4e5ef"/>
    </radialGradient>
    <linearGradient id="ds4-bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f1f8"/>
      <stop offset="1" stop-color="#dcdce8"/>
    </linearGradient>
    <linearGradient id="ds4-touch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ea3b5"/>
      <stop offset="1" stop-color="#6a7083"/>
    </linearGradient>
    <radialGradient id="ds4-cap" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9ea3b5"/>
      <stop offset="1" stop-color="#6a7083"/>
    </radialGradient>
    <radialGradient id="ds4-ring" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececf0"/>
    </radialGradient>
    <pattern id="ds4-dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1" fill="#4a4a4f"/>
    </pattern>
    <filter id="ds4-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b2540" flood-opacity="0.2"/>
    </filter>
