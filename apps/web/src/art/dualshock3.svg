<svg xmlns="http://www.w3.org/2000/svg" viewBox="186 146 826 566" role="img">
  <!--
    DualShock 3, front view: the project owner's design (2026-10-14). The
    stick caps take the DualSense's colours, as every drawing does.

    Marked up for the tester like art/dualsense.svg (see there): L1 and R1
    stand behind the body, and the L2/R2 travel bars go above them.
  -->
  <defs>
    <linearGradient id="ps3-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f2f7"/>
      <stop offset="1" stop-color="#dcdfe9"/>
    </linearGradient>
    <linearGradient id="ps3-trig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#dde0ea"/>
    </linearGradient>
    <radialGradient id="ps3-dome" cx="0.45" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebf2"/>
    </radialGradient>
    <linearGradient id="ps3-btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e5ee"/>
    </linearGradient>
    <radialGradient id="ps3-collar" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6f7fa"/>
      <stop offset="1" stop-color="#dde0ea"/>
    </radialGradient>
    <linearGradient id="ps3-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ee"/>
      <stop offset="1" stop-color="#c9cddb"/>
    </linearGradient>
    <radialGradient id="ps3-cap" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9ea3b5"/>
      <stop offset="1" stop-color="#6a7083"/>
    </radialGradient>
    <filter id="ps3-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1b2540" flood-opacity="0.2"/>
    </filter>
    <filter id="ps3-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b2540" flood-opacity="0.22"/>
    </filter>
  </defs>

