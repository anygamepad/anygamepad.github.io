<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 70 510 375" role="img">
  <!--
    DualSense, front view: the project owner's design (2026-10-14).

    The tester animates it through data attributes (drawing.ts):
    - data-button="<canonical button>": a control; its .shape elements take
      the accent colour while the button is pressed, its .mark elements
      (symbols, arrows) turn light on it.
    - data-stick="left|right": a stick; its data-cap group moves with the
      stick's axes (data-travel units at full tilt), and it is the stick's
      click button.
    - data-touchpad="x y width height": the area where fingers are drawn.
    - data-trigger="<axis>" with data-x, data-y, data-width, data-height:
      where the trigger's travel bar goes (L2 and R2 are not in the front
      view).
  -->
  <defs>
    <linearGradient id="ds-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8fc"/>
      <stop offset="0.55" stop-color="#e7e8f0"/>
      <stop offset="1" stop-color="#d2d9e6"/>
    </linearGradient>
    <linearGradient id="ds-bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f1f8"/>
      <stop offset="1" stop-color="#dcdce8"/>
    </linearGradient>
    <linearGradient id="ds-touch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efeef8"/>
      <stop offset="1" stop-color="#dedcee"/>
    </linearGradient>
    <radialGradient id="ds-cap" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9ea3b5"/>
      <stop offset="1" stop-color="#6a7083"/>
    </radialGradient>
    <radialGradient id="ds-btn" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="1" stop-color="#e4e5ef"/>
    </radialGradient>
    <filter id="ds-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b2540" flood-opacity="0.18"/>
    </filter>
    <filter id="ds-glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Triggers L2 / R2: travel bars, drawn by the tester -->
  <g data-trigger="left_trigger" data-x="96" data-y="80" data-width="54" data-height="14"/>
  <g data-trigger="right_trigger" data-x="380" data-y="80" data-width="54" data-height="14"/>

  <!-- Bumpers L1 / R1 -->
  <g data-button="left_shoulder">
    <path class="shape" d="M92 126 C90 113 95 106 105 106 H140 C147 106 149 110 149 118 L150 126 Z"
          fill="url(#ds-bump)" stroke="#b4b8c8" stroke-width="1.2"/>
  </g>
  <g data-button="right_shoulder">
    <path class="shape" d="M438 126 C440 113 435 106 425 106 H390 C383 106 381 110 381 118 L380 126 Z"
          fill="url(#ds-bump)" stroke="#b4b8c8" stroke-width="1.2"/>
  </g>

  <!-- Body -->
  <path d="M148 117 C110 112 90 118 75 128 C45 160 28 240 25 300 C23 345 30 385 45 417
           C52 428 62 433 72 433 C88 432 98 420 105 405 C108 385 112 370 120 352
           C130 330 140 318 160 311 L370 311 C390 318 400 330 410 352
           C418 370 422 385 425 405 C432 420 442 432 458 433 C468 433 478 428 485 417
           C500 385 507 345 505 300 C502 240 485 160 455 128 C440 118 420 112 382 117 Z"
        fill="url(#ds-body)" stroke="#b9bdcc" stroke-width="1.2" filter="url(#ds-shadow)"/>

  <!-- Seams between the front plate and the grips -->
  <g fill="none" stroke="#6b6f80" stroke-width="1.2" stroke-opacity="0.85" stroke-linecap="round">
    <path d="M176 214 C150 235 128 262 112 300 S84 380 70 410"/>
    <path d="M354 214 C380 235 402 262 418 300 S446 380 460 410"/>
  </g>

  <!-- Touchpad -->
  <g data-button="touchpad_click" data-touchpad="182 118 166 92">
    <path class="shape" d="M170 118 C200 110 330 110 360 118 L349 198 C347 208 338 215 324 215 H206
             C192 215 183 208 181 198 Z"
          fill="url(#ds-touch)" stroke="#a9adbd" stroke-width="1"/>
  </g>

  <!-- Light bar -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#ds-glow)" stroke="#2b4bff" stroke-width="3.4">
      <path d="M168 120 L180 196 C181 203 184 208 190 211"/>
      <path d="M362 120 L350 196 C349 203 346 208 340 211"/>
    </g>
    <path d="M190 211 C196 214 201 215 207 215 H323 C329 215 334 214 340 211" stroke="#20233f" stroke-width="3"/>
  </g>

  <!-- Create / Options -->
  <g data-button="select">
    <rect class="shape" x="146.5" y="134" width="9" height="20" rx="4.5" transform="rotate(-6 151 144)"
          fill="#f4f4fa" stroke="#a9adbd" stroke-width="1.2"/>
  </g>
  <g data-button="start">
    <rect class="shape" x="374.5" y="134" width="9" height="20" rx="4.5" transform="rotate(6 379 144)"
          fill="#f4f4fa" stroke="#a9adbd" stroke-width="1.2"/>
  </g>

  <!-- Speaker -->
  <g fill="#23242c">
    <circle cx="249" cy="226" r="2.1"/><circle cx="257" cy="226" r="2.1"/><circle cx="265" cy="226" r="2.1"/><circle cx="273" cy="226" r="2.1"/><circle cx="281" cy="226" r="2.1"/>
    <circle cx="253" cy="234" r="2.1"/><circle cx="261" cy="234" r="2.1"/><circle cx="269" cy="234" r="2.1"/><circle cx="277" cy="234" r="2.1"/>
  </g>

  <!-- PS button -->
  <g data-button="home">
    <circle class="shape" cx="265" cy="262" r="12" fill="url(#ds-btn)" stroke="#aeb2c2" stroke-width="1.6"/>
    <circle class="mark" cx="265" cy="262" r="6.5" fill="none" stroke="#c3c7d6" stroke-width="1.4"/>
  </g>

  <!-- Mute button -->
  <g data-button="mute">
    <rect class="shape" x="252" y="285" width="26" height="6.5" rx="3.25" fill="#25262d"/>
  </g>

  <!-- Sticks: the well stays, the cap moves -->
  <g data-stick="left" data-travel="7" transform="translate(187 262)">
    <circle r="38" fill="#cfd2de" stroke="#aeb2c3" stroke-width="1.2"/>
    <circle r="31" fill="#b9bdcc" stroke="#9a9fb1" stroke-width="1.5"/>
    <g data-cap="" data-button="left_stick">
      <circle class="shape" r="26" fill="url(#ds-cap)" stroke="#5a5f71" stroke-width="1.2"/>
      <circle class="shape" r="19" fill="none" stroke="#8a90a3" stroke-width="1.5"/>
    </g>
  </g>
  <g data-stick="right" data-travel="7" transform="translate(343 262)">
    <circle r="38" fill="#cfd2de" stroke="#aeb2c3" stroke-width="1.2"/>
    <circle r="31" fill="#b9bdcc" stroke="#9a9fb1" stroke-width="1.5"/>
    <g data-cap="" data-button="right_stick">
      <circle class="shape" r="26" fill="url(#ds-cap)" stroke="#5a5f71" stroke-width="1.2"/>
      <circle class="shape" r="19" fill="none" stroke="#8a90a3" stroke-width="1.5"/>
    </g>
  </g>

  <!-- D-pad: one arm, rotated around (115 195) -->
  <g data-button="dpad_up">
    <path class="shape" d="M104.560 181.550 L102 167 Q100.500 157 110 157 H120 Q129.500 157 128 167 L125.440 181.550 L115 192 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="2" stroke-linejoin="round"/>
    <path class="mark" d="M110 173 L115 165 L120 173 Z" fill="#8d90a0"/>
  </g>
  <g data-button="dpad_right" transform="rotate(90 115 195)">
    <path class="shape" d="M104.560 181.550 L102 167 Q100.500 157 110 157 H120 Q129.500 157 128 167 L125.440 181.550 L115 192 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="2" stroke-linejoin="round"/>
    <path class="mark" d="M110 173 L115 165 L120 173 Z" fill="#8d90a0"/>
  </g>
  <g data-button="dpad_down" transform="rotate(180 115 195)">
    <path class="shape" d="M104.560 181.550 L102 167 Q100.500 157 110 157 H120 Q129.500 157 128 167 L125.440 181.550 L115 192 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="2" stroke-linejoin="round"/>
    <path class="mark" d="M110 173 L115 165 L120 173 Z" fill="#8d90a0"/>
  </g>
  <g data-button="dpad_left" transform="rotate(270 115 195)">
    <path class="shape" d="M104.560 181.550 L102 167 Q100.500 157 110 157 H120 Q129.500 157 128 167 L125.440 181.550 L115 192 Z"
          fill="#f6f6fb" stroke="#3a3c48" stroke-width="2" stroke-linejoin="round"/>
    <path class="mark" d="M110 173 L115 165 L120 173 Z" fill="#8d90a0"/>
  </g>

  <!-- Face buttons: triangle, square, circle, cross -->
  <g data-button="north">
    <circle class="shape" cx="415" cy="160" r="16" fill="url(#ds-btn)" stroke="#aeb2c2" stroke-width="1.6"/>
    <path class="mark" d="M415 152 L422.5 165 H407.5 Z"
          fill="none" stroke="#6f7282" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-button="west">
    <circle class="shape" cx="380" cy="195" r="16" fill="url(#ds-btn)" stroke="#aeb2c2" stroke-width="1.6"/>
    <rect class="mark" x="373.5" y="188.5" width="13" height="13" rx="1"
          fill="none" stroke="#6f7282" stroke-width="1.6"/>
  </g>
  <g data-button="east">
    <circle class="shape" cx="450" cy="195" r="16" fill="url(#ds-btn)" stroke="#aeb2c2" stroke-width="1.6"/>
    <circle class="mark" cx="450" cy="195" r="7" fill="none" stroke="#6f7282" stroke-width="1.6"/>
  </g>
  <g data-button="south">
    <circle class="shape" cx="415" cy="231" r="16" fill="url(#ds-btn)" stroke="#aeb2c2" stroke-width="1.6"/>
    <path class="mark" d="M409 225 L421 237 M421 225 L409 237"
          fill="none" stroke="#6f7282" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
