[package]
name = "anygamepad-desktop"
description = "The anygamepad desktop app: controllers, virtual pads and collection mode."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "anygamepad"
path = "src/main.rs"

[dependencies]
anygamepad.workspace = true
anygamepad-virtual.workspace = true
# egui through eframe (ADR 0004), with the glow renderer: see
# RECORD/2026-10-30.a1-desktop-app-shell.*.md.
eframe = { version = "0.32.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
log = "0.4"
serde.workspace = true
toml.workspace = true

# System tray: StatusNotifierItem over D-Bus on Linux (pure Rust), the
# native tray elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"
