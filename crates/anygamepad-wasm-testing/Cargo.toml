[package]
name = "anygamepad-wasm-testing"
description = "WebAssembly (wasm-bindgen) bindings of anygamepad's test mode, a module of its own for the web app."
readme = "README.md"
keywords = ["gamepad", "controller", "wasm", "testing"]
categories = ["game-development", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Built into the web app, never published on crates.io.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The test runner (ADR 0008), without the providers: the tester's module
# (anygamepad-wasm) reads the devices and hands over what a session needs.
# A path rather than the workspace entry: Cargo 1.85 (the MSRV) does not let
# a member turn off a workspace dependency's default features.
anygamepad = { path = "../anygamepad", default-features = false, features = ["testing"] }
anygamepad-report.workspace = true
# Same crate as `anygamepad::model`, with the TypeScript declarations.
anygamepad-model = { workspace = true, features = ["tsify"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

# The web app runs wasm-opt itself (see anygamepad-wasm).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
