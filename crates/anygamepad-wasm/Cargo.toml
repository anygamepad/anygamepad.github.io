[package]
name = "anygamepad-wasm"
description = "WebAssembly (wasm-bindgen) bindings of anygamepad for the web app."
readme = "README.md"
keywords = ["gamepad", "controller", "wasm"]
categories = ["game-development", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anygamepad.workspace = true
# Same crate as `anygamepad::model`, with the TypeScript declarations.
anygamepad-model = { workspace = true, features = ["tsify"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
js-sys.workspace = true
wasm-bindgen-test.workspace = true
