[package]
name = "anygamepad-wasm"
description = "WebAssembly (wasm-bindgen) bindings of anygamepad for the web app."
readme = "README.md"
keywords = ["gamepad", "controller", "wasm"]
categories = ["game-development", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anygamepad.workspace = true
anygamepad-report.workspace = true
# Same crate as `anygamepad::model`, with the TypeScript declarations.
anygamepad-model = { workspace = true, features = ["tsify"] }
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true
# Feature reports the protocol drivers read through WebHID.
wasm-bindgen-futures.workspace = true

[dev-dependencies]
anygamepad-report = { workspace = true, features = ["json"] }
wasm-bindgen-test.workspace = true

# The web app runs wasm-opt itself, from the binaryen version pinned in
# apps/web/package.json, rather than the older copy wasm-pack downloads.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
