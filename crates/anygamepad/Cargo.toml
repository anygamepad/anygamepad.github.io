[package]
name = "anygamepad"
description = "Normalized gamepad input for Rust games, across devices, modes, transports and operating systems."
readme = "README.md"
keywords = ["gamepad", "controller", "joystick", "input", "gamedev"]
categories = ["game-development", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["web", "native"]
# Browser provider (ADR 0002): the Gamepad API and WebHID access on wasm32.
# On other targets only its platform-independent parts build (user agent
# parsing, standard mapping), which keeps them testable natively.
# Native providers (ADR 0002): evdev and hidraw on Linux, IOKit HID and
# GameController on macOS. The platform-independent parts (evdev decoding,
# HID pads, GameController snapshots) build everywhere.
native = [
    "dep:anygamepad-hid",
    "dep:evdev",
    "dep:nix",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-game-controller",
    "dep:objc2-io-kit",
]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
# The test runner of the apps' test modes (ADR 0008): `anygamepad::testing`,
# which writes test reports (anygamepad-report).
testing = ["dep:anygamepad-report"]

[dependencies]
anygamepad-db.workspace = true
anygamepad-hid = { workspace = true, optional = true }
anygamepad-model.workspace = true
anygamepad-report = { workspace = true, optional = true }

[dev-dependencies]
# Curated profiles are TOML files.
anygamepad-db = { workspace = true, features = ["toml"] }
anygamepad-report.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", optional = true }
# Raw HID: feature report ioctls and non-blocking opens.
nix = { version = "0.29", features = ["fs", "ioctl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFData",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFSet",
    "CFString",
] }
objc2-game-controller = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "GCColor",
    "GCController",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCDevice",
    "GCDeviceBattery",
    "GCDeviceLight",
    "GCDualSenseGamepad",
    "GCDualShockGamepad",
    "GCExtendedGamepad",
    "GCMotion",
    "GCPhysicalInputProfile",
    "GCProductCategories",
    "GCXboxGamepad",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "hid",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Event",
    "EventTarget",
    "Gamepad",
    "GamepadButton",
    "GamepadEvent",
    "Navigator",
    "Performance",
    "Window",
] }

[[example]]
name = "linux_pads"
required-features = ["native"]

[[example]]
name = "macos_pads"
required-features = ["native"]

[[test]]
name = "testing"
required-features = ["testing", "web"]
