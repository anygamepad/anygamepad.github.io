[package]
name = "anygamepad"
description = "Normalized gamepad input for Rust games, across devices, modes, transports and operating systems."
readme = "README.md"
keywords = ["gamepad", "controller", "joystick", "input", "gamedev"]
categories = ["game-development", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["web", "native"]
# Browser provider (ADR 0002): the Gamepad API and WebHID access on wasm32.
# On other targets only its platform-independent parts build (user agent
# parsing, standard mapping), which keeps them testable natively.
# Native providers (ADR 0002): evdev on Linux. The platform-independent
# parts (evdev decoding) build everywhere.
native = ["dep:evdev"]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
anygamepad-db.workspace = true
anygamepad-model.workspace = true

[dev-dependencies]
# Curated profiles are TOML files.
anygamepad-db = { workspace = true, features = ["toml"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Event",
    "EventTarget",
    "Gamepad",
    "GamepadButton",
    "GamepadEvent",
    "Navigator",
    "Performance",
    "Window",
] }

[[example]]
name = "linux_pads"
required-features = ["native"]
