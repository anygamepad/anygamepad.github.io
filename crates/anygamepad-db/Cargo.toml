[package]
name = "anygamepad-db"
description = "Device profile format and embedded device database for anygamepad."
readme = "README.md"
keywords = ["gamepad", "controller", "input"]
categories = ["game-development", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["embedded-sdl"]
# Embeds the copy of SDL GameControllerDB in `data/sdl-gamecontrollerdb/`.
# On non-wasm32 targets, includes the converted database for instant coverage.
embedded-sdl = []
# Read and write profiles as TOML (`Profile::from_toml`, `Profile::to_toml`):
# the source format of `data/profiles/` and of runtime overrides (ADR 0003).
toml = ["dep:toml"]
# JSON Schema of the profile format (`json_schema`).
schemars = ["dep:schemars", "anygamepad-model/schemars"]

[dependencies]
anygamepad-model = { workspace = true, features = ["serde"] }
postcard.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
toml = { workspace = true, optional = true }

[build-dependencies]
anygamepad-model = { workspace = true, features = ["serde", "schemars"] }
postcard.workspace = true
schemars.workspace = true
serde.workspace = true
toml = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
serde_json.workspace = true

[[test]]
name = "profiles"
required-features = ["toml", "schemars"]

[[test]]
name = "sdl_gamecontrollerdb"
required-features = ["toml", "schemars"]

[[test]]
name = "database"
required-features = ["toml"]

[[test]]
name = "catalog"
required-features = ["toml", "schemars"]

[[test]]
name = "plans"
required-features = ["toml", "schemars"]

[[example]]
name = "sdl_import"
required-features = ["toml"]
