[package]
name = "anygamepad-virtual"
description = "Virtual controller outputs for the anygamepad desktop app."
readme = "README.md"
keywords = ["gamepad", "controller", "virtual"]
categories = ["hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anygamepad-model.workspace = true

# Linux outputs (A5): uinput through the evdev crate, UHID through a plain
# file; nix sets non-blocking mode without unsafe code.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
# The PlayStation tests decode the emulated reports with C15's decoder.
anygamepad.workspace = true
