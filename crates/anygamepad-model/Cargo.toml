[package]
name = "anygamepad-model"
description = "Canonical gamepad model types used by anygamepad."
readme = "README.md"
keywords = ["gamepad", "controller", "input"]
categories = ["game-development", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Serialize the model with serde: snake_case names in human-readable formats
# (TOML, JSON), compact indices in binary formats (postcard).
serde = ["dep:serde"]
# JSON Schema of the serde representation (implies `serde`).
schemars = ["dep:schemars", "serde"]

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
postcard.workspace = true
serde_json.workspace = true
